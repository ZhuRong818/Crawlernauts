<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crawlernaut</title>

    <!-- Viewport for responsive Bootstrap layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional: small favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>


    <!-- Bootstrap CSS (we also import in JS, but including here avoids FOUC) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      integrity="sha384-lZN37f..."
      crossorigin="anonymous"
    />

    <!-- CRA will inject the compiled JS bundle right before </body> -->
  </head>

  <body class="bg-light">
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- React mounts here -->
    <div id="root"></div>
  </body>
</html>
